[project]
name = "character-consistency-video-factory"
version = "0.1.0"
description = "Local-first character-consistent video workflow API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.133,<0.134",
  "starlette>=1.3.1,<1.4",
  "Pillow>=13,<14",
  "certifi>=2026.10.19",
  "uvicorn[standard]>=0.30,<0.36",
  "sqlalchemy>=2.0,<2.1",
  "alembic>=1.13,<2",
  "pydantic>=2.8,<3",
  "python-multipart>=0.0.9",
  "python-docx>=1.1,<2",
  "httpx>=0.27,<0.28",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.pytest.ini_options]
testpaths = ["../tests/backend"]
addopts = "-q"

