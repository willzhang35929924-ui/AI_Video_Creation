worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    server_tokens off;
    charset utf-8;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65s;

    # All writable NGINX state stays in the container's /tmp tmpfs.
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    # Docker's embedded DNS must be rechecked after a backend container rebuild.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    server {
        listen 8080;
        root /usr/share/nginx/html;
        index index.html;
        add_header X-Content-Type-Options nosniff always;

        # The largest accepted batch is 20 x 100 MiB voice files plus multipart
        # overhead. Per-file/type/duration limits remain enforced by the API.
        client_max_body_size 2g;
        client_body_timeout 3600s;
        send_timeout 3600s;

        location = /health {
            access_log off;
            default_type text/plain;
            return 200 "video-factory-frontend\n";
        }

        # API and legacy media responses are never replaced with the SPA entry.
        # A variable upstream re-resolves Docker DNS when backend's IP changes.
        location ~ ^/(api|media)(/|$) {
            set $api_backend http://backend:8765;
            proxy_pass $api_backend$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Range $http_range;
            proxy_set_header If-Range $http_if_range;
            proxy_connect_timeout 10s;
            # This is an idle-read timeout, not a background job duration limit.
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_intercept_errors off;
            proxy_cache off;
        }

        # These React routes intentionally share Vite's /assets prefix.
        location ~ ^/assets/(products|videos|voices)/?$ {
            try_files /index.html =404;
            add_header Cache-Control "no-store";
        }

        location = /index.html {
            add_header Cache-Control "no-cache";
        }

        # A missing bundle must be a real 404, never HTML with status 200.
        location /assets/ {
            try_files $uri =404;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        location ~* \.(?:js|mjs|css|map|json|png|jpe?g|webp|gif|svg|ico|woff2?|ttf)$ {
            try_files $uri =404;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
