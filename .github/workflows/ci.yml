name: Source and container checks

'on':
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  backend:
    name: Published backend tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONPATH: backend
      VIDEO_FACTORY_CONTAINER: '0'
    steps:
      # Upstream release SHAs verified 2026-10-30. Update pins deliberately.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-docker.lock
      - name: Reject private runtime files in the Git tree
        run: |
          python - <<'PY'
          import pathlib, subprocess
          paths = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          bad = []
          private_roots = {'data', 'logs', 'reports', 'backups', 'private-backups', 'models', '.release-tools'}
          binary_suffixes = {'.db', '.sqlite', '.sqlite3', '.pyc', '.safetensors', '.ckpt', '.pt', '.pth', '.bin', '.gguf', '.onnx', '.mp4', '.wav', '.mp3', '.m4a', '.pem', '.key'}
          for name in filter(None, paths):
              path = pathlib.PurePosixPath(name)
              if (path.parts[0] in private_roots or
                  any(part in {'__pycache__', 'node_modules', '.venv', '.pytest_cache'} for part in path.parts) or
                  (path.name.startswith('.env') and path.name != '.env.example') or
                  path.name in {'compose.override.yaml', 'compose.override.yml'} or
                  path.suffix.lower() in binary_suffixes):
                  bad.append(name)
          if bad:
              raise SystemExit('Private/generated files must not be tracked:\n' + '\n'.join(bad))
          print('Tracked-tree hygiene passed; this does not replace the release secret/provenance audit.')
          PY
      - name: Install hash-verified binary application dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r backend/requirements-docker.lock
      - name: Install pinned ephemeral test dependencies and media tools
        run: |
          python -m pip install pytest==8.4.2 iniconfig==2.3.1 packaging==26.3 pluggy==1.7.0 Pygments==2.21.0
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ffmpeg fonts-dejavu-core
      - name: Initialize an ephemeral test-only encrypted key store
        run: |
          python - <<'PY'
          import os, pathlib
          from cryptography.fernet import Fernet
          path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'unit-master.key'
          descriptor = os.open(path, os.O_CREAT | os.O_EXCL | os.O_WRONLY, 0o600)
          with os.fdopen(descriptor, 'wb') as stream:
              stream.write(Fernet.generate_key() + b'\n')
          assert path.stat().st_mode & 0o777 == 0o600
          with open(os.environ['GITHUB_ENV'], 'a') as environment:
              environment.write('VIDEO_FACTORY_SECRET_KEY_FILE=' + str(path) + '\n')
          print('Ephemeral Fernet key initialized for Linux unit tests; no key value is logged or uploaded.')
          PY
      - name: Generate a labelled unit-test video fixture
        run: |
          mkdir -p fixtures
          ffmpeg -hide_banner -loglevel error -y -f lavfi \
            -i 'color=c=0x111827:s=368x640:r=12:d=2' \
            -vf "drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='UNIT TEST ONLY - NOT AI VIDEO':fontcolor=white:fontsize=14:x=(w-tw)/2:y=(h-th)/2" \
            -an -c:v libx264 -pix_fmt yuv420p -movflags +faststart fixtures/demo_status_replay.mp4
      - name: Check shared production contracts
        run: python scripts/build_cinematic_contracts.py --check
      - name: Run all backend tests included in the public source tree
        run: python -m pytest tests/backend
      - name: Check verified backup and restore helper
        run: python -m unittest discover -s docker -p test_volume_archive.py -v

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  image_build:
    name: Build ${{ matrix.component }} for AMD64 and ARM64
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Derive metadata from this checkout
        id: metadata
        run: |
          echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          python - <<'PY'
          import os, pathlib
          text = pathlib.Path('LICENSE').read_text() if pathlib.Path('LICENSE').exists() else ''
          license_id = 'MIT' if 'MIT License' in text else 'Apache-2.0' if 'Apache License' in text and 'Version 2.0' in text else 'NOASSERTION'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('license=' + license_id + '\n')
          PY
      # PR jobs never log in or push. OCI archives let CI inspect both built
      # architectures without claiming that QEMU is a physical Mac test.
      - name: Build a local OCI archive without publishing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.component }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          outputs: type=oci,dest=/tmp/${{ matrix.component }}-ci.oci.tar
          build-args: |
            APP_VERSION=sha-${{ github.sha }}
            VCS_REF=${{ github.sha }}
            VCS_SOURCE=${{ github.server_url }}/${{ github.repository }}
            BUILD_DATE=${{ steps.metadata.outputs.created }}
            APP_LICENSE=${{ steps.metadata.outputs.license }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
      - name: Inspect the actual OCI archive architecture and revision
        env:
          OCI_ARCHIVE: /tmp/${{ matrix.component }}-ci.oci.tar
        run: |
          python - <<'PY'
          import json, os, tarfile
          expected = {'amd64', 'arm64'}
          found = set()
          with tarfile.open(os.environ['OCI_ARCHIVE']) as archive:
              def read_blob(digest):
                  algorithm, value = digest.split(':', 1)
                  assert algorithm == 'sha256'
                  return json.load(archive.extractfile('blobs/sha256/' + value))
              def visit(document):
                  for descriptor in document.get('manifests', []):
                      visit(read_blob(descriptor['digest']))
                  if 'config' in document:
                      config = read_blob(document['config']['digest'])
                      arch = config.get('architecture')
                      if config.get('os') == 'linux' and arch in expected:
                          labels = config.get('config', {}).get('Labels', {})
                          assert labels.get('org.opencontainers.image.revision') == os.environ['GITHUB_SHA']
                          assert labels.get('org.opencontainers.image.source') == os.environ['GITHUB_SERVER_URL'] + '/' + os.environ['GITHUB_REPOSITORY']
                          found.add(arch)
              visit(json.load(archive.extractfile('index.json')))
          assert found == expected, found
          print('Actual OCI images and revision verified:', ', '.join(sorted(found)))
          PY

  compose_runtime:
    name: Clean Compose startup and persistence
    needs: [backend, frontend, image_build]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      COMPOSE_PROJECT_NAME: ci-${{ github.run_id }}-${{ github.run_attempt }}
      BACKEND_DEV_IMAGE: video-factory-backend:ci
      FRONTEND_DEV_IMAGE: video-factory-frontend:ci
      WEB_PORT: '18083'
      BIND_ADDRESS: 127.0.0.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Stamp the runtime probe images with the checked revision
        id: metadata
        run: |
          echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          python - <<'PY'
          import os, pathlib
          text = pathlib.Path('LICENSE').read_text() if pathlib.Path('LICENSE').exists() else ''
          license_id = 'MIT' if 'MIT License' in text else 'Apache-2.0' if 'Apache License' in text and 'Version 2.0' in text else 'NOASSERTION'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('license=' + license_id + '\n')
          PY
      - name: Load the checked AMD64 backend image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: backend/Dockerfile
          platforms: linux/amd64
          load: true
          tags: video-factory-backend:ci
          build-args: |
            APP_VERSION=sha-${{ github.sha }}
            VCS_REF=${{ github.sha }}
            VCS_SOURCE=${{ github.server_url }}/${{ github.repository }}
            BUILD_DATE=${{ steps.metadata.outputs.created }}
            APP_LICENSE=${{ steps.metadata.outputs.license }}
          cache-from: type=gha,scope=backend
      - name: Load the checked AMD64 frontend image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: frontend/Dockerfile
          platforms: linux/amd64
          load: true
          tags: video-factory-frontend:ci
          build-args: |
            APP_VERSION=sha-${{ github.sha }}
            VCS_REF=${{ github.sha }}
            VCS_SOURCE=${{ github.server_url }}/${{ github.repository }}
            BUILD_DATE=${{ steps.metadata.outputs.created }}
            APP_LICENSE=${{ steps.metadata.outputs.license }}
          cache-from: type=gha,scope=frontend
      - name: Verify loaded image revision labels
        run: |
          for image in "$BACKEND_DEV_IMAGE" "$FRONTEND_DEV_IMAGE"; do
            actual=$(docker image inspect "$image" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')
            [ "$actual" = "$GITHUB_SHA" ]
          done
      - name: Start a new isolated deployment
        run: docker compose --env-file /dev/null -f compose.dev.yaml up -d --no-build --pull never --wait --wait-timeout 180
      - name: Test fresh state, API writes and Word parsing through Nginx
        run: |
          python - <<'PY'
          import hashlib, json, pathlib, urllib.request
          base = 'http://127.0.0.1:18083'
          def call(path, payload=None, content_type='application/json'):
              data = json.dumps(payload).encode() if isinstance(payload, dict) else payload
              request = urllib.request.Request(base + path, data=data)
              if data is not None:
                  request.add_header('Content-Type', content_type)
              with urllib.request.urlopen(request, timeout=45) as response:
                  return json.load(response)
          health = call('/api/health/runtime')
          assert health['application_ready'] is True
          assert health['status'] == 'degraded', health
          assert health['external_services']['missing_for_ai_generation'], health
          assert call('/api/projects') == [], 'Fresh volumes unexpectedly contain projects'
          assert call('/api/characters') == [], 'Fresh volumes unexpectedly contain characters'
          project = call('/api/projects', {'name': 'CI synthetic persistence probe'})
          # This deliberately unavailable profile tests encrypted persistence,
          # not a cloud connection. No inference/test-provider request is sent.
          token = 'ci-only-synthetic-token'
          service = call('/api/settings/ai-services', {
              'module': 'language_processing', 'provider': 'openai_compatible',
              'name': 'CI configuration-only profile', 'base_url': 'https://example.com/v1',
              'default_model': 'ci-unavailable-model', 'api_key': token})
          assert service['has_api_key'] and token not in json.dumps(service)
          boundary = 'CIWordImportBoundary'
          document = pathlib.Path('tests/fixtures/screenplays/standard.docx').read_bytes()
          body = (f'--{boundary}\r\nContent-Disposition: form-data; name="auto_start"\r\n\r\nfalse\r\n'
                  f'--{boundary}\r\nContent-Disposition: form-data; name="file"; filename="ci-synthetic.docx"\r\n'
                  'Content-Type: application/vnd.openxmlformats-officedocument.wordprocessingml.document\r\n\r\n').encode()
          body += document + f'\r\n--{boundary}--\r\n'.encode()
          imported = call('/api/studio/import', body, 'multipart/form-data; boundary=' + boundary)
          assert imported['import_id'] and imported['status'] in {'imported', 'pending_review'}, imported
          assert imported['summary']['shots'] > 0, imported
          assert imported['parser']['language_model_called'] is False, imported
          pathlib.Path('/tmp/ci-persistence.json').write_text(json.dumps({
              'project_id': project['id'], 'service_id': service['id'], 'import_id': imported['import_id'],
              'word_sha256': hashlib.sha256(document).hexdigest()}))
          print('Fresh state, real API writes and source-preserving Word parsing passed. AI inference was not attempted.')
          PY
      - name: Write isolated probes in all three persistent volumes
        run: |
          docker compose --env-file /dev/null -f compose.dev.yaml exec -T backend python - <<'PY'
          from pathlib import Path
          for name in ['data', 'logs', 'reports']:
              (Path('/app') / name / 'ci-volume-probe.txt').write_text('CI synthetic volume probe')
          PY
      - name: Recreate containers without deleting volumes
        run: docker compose --env-file /dev/null -f compose.dev.yaml up -d --no-build --pull never --force-recreate --wait --wait-timeout 180
      - name: Verify persisted business records and encrypted credentials
        run: |
          python - <<'PY'
          import hashlib, json, pathlib, urllib.request
          base = 'http://127.0.0.1:18083'
          def get(path):
              with urllib.request.urlopen(base + path, timeout=15) as response:
                  return json.load(response)
          state = json.loads(pathlib.Path('/tmp/ci-persistence.json').read_text())
          assert get('/api/projects/' + state['project_id'])['name'] == 'CI synthetic persistence probe'
          profile = next(item for item in get('/api/settings/ai-services') if item['id'] == state['service_id'])
          assert profile['has_api_key'] and 'ci-only-synthetic-token' not in json.dumps(profile)
          imported = get('/api/word-imports/' + state['import_id'])
          assert imported['id'] == state['import_id']
          with urllib.request.urlopen(base + '/api/media/' + imported['relative_path'], timeout=15) as response:
              assert hashlib.sha256(response.read()).hexdigest() == state['word_sha256']
          assert get('/api/health/runtime')['application_ready'] is True
          print('Recreated containers retain project, Word import and encrypted profile.')
          PY
          docker compose --env-file /dev/null -f compose.dev.yaml exec -T backend python - <<'PY'
          from pathlib import Path
          for name in ['data', 'logs', 'reports']:
              assert (Path('/app') / name / 'ci-volume-probe.txt').read_text() == 'CI synthetic volume probe'
          print('All three named volumes retained their probe files.')
          PY
      - name: Show status and key logs
        if: always()
        run: |
          docker compose --env-file /dev/null -f compose.dev.yaml ps --all
          docker compose --env-file /dev/null -f compose.dev.yaml logs --no-color --tail 120
      - name: Stop only this isolated deployment; keep its volumes
        if: always()
        run: docker compose --env-file /dev/null -f compose.dev.yaml down
